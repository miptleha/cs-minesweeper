<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Сапёр</title>
    <base href="/" />
    
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="MinesweeperBlazorHybrid.styles.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    
    <style>
        /* Базовый сброс стилей для десктопного приложения */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #F0F0F0; /* Классический серый цвет WinForms */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; /* Запрещаем выделение текста при кликах по полю */
            overflow: hidden;  /* Убираем полосы прокрутки */
        }
    </style>
</head>

<body>
    <!-- Сюда Blazor будет рендерить компоненты -->
    <div id="app">
        <!-- Можно оставить пустым, загрузка мгновенная -->
    </div>

    <!-- Стандартный блок ошибок Blazor (на случай сбоя) -->
    <div id="blazor-error-ui" style="display: none; position: fixed; bottom: 0; width: 100%; background: #ffd800; padding: 10px; z-index: 1000;">
        Произошла непредвиденная ошибка.
        <a href="" class="reload">Перезагрузить</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js"></script>
    
    <script>
        // Группа 9.3: при потере фокуса окна — закрыть меню через DOM-клик по оверлею.
        window.addEventListener('blur', function () {
            var overlay = document.querySelector('.menu-overlay');
            if (overlay) {
                overlay.click();
            }
        });
    </script>
</body>

</html>
